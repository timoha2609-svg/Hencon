<style>

<style>

let curPlat = localStorage.getItem("cur_plat") || "P1402";
if (!DB[curPlat]) curPlat = Object.keys(DB);
let curTab = "s";

const DICT_BASE = [
  {k:"MCUM (A1)", v:"Главный контроллер управления машиной (TTC-30 / TTC-50)."},
  {k:"DCUM (A20)", v:"Центральный дисплей оператора в кабине (CAN0 / CAN1)."},
  {k:"TCU (A11–A14)", v:"Ведомые модули расширения входов/выходов на стреле и прицепе."},
  {k:"PVG", v:"Пропорциональный электрогидравлический распределитель (Danfoss)."},
  {k:"E-STOP", v:"Последовательный шлейф аварийных грибков останова (+24В)."},
  {k:"CAN0 / CAN1 / CAN2", v:"CAN0 (500k) — контроллеры/пульты; CAN1 (250k) — двигатель Deutz J1939; CAN2 (125k) — инклинометры."}
];

function onGroupChange(grp) {
  localStorage.setItem("cur_grp", grp);
  fillPlats(grp);
  const sel = document.getElementById("platSel");
  if (sel.value && DB[sel.value] && sel.value !== curPlat) switchPlatform(sel.value);
}

function fillPlats(grp) {
  const sel = document.getElementById("platSel");
  const ids = Object.keys(DB).filter(id => grp === "ALL" || DB[id].group === grp);
  sel.innerHTML = ids.length
    ? ids.map(id => `<option value="${id}">${DB[id].name}</option>`).join("")
    : `<option value="">— В группе пока нет машин —</option>`;
  if (ids.includes(curPlat)) sel.value = curPlat;
}

function switchPlatform(id) {
  if (!DB[id]) return;
  curPlat = id;
  localStorage.setItem("cur_plat", id);
  document.getElementById("q").value = "";
  draw();
}

function setTab(t) {
  curTab = t;
  document.querySelectorAll(".nb").forEach(b => b.classList.remove("act"));
  const btn = document.getElementById("tab-" + t);
  if (btn) btn.classList.add("act");
  draw();
}

function showModal(title, html) {
  const m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div class="m-box"><div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b;padding-bottom:10px;margin-bottom:12px;"><b style="color:#38bdf8;font-size:16px;">${title}</b><button class="btn" style="border-color:#ef4444;color:#f87171;" onclick="this.closest('.modal').remove()">Закрыть ✕</button></div>${html}</div>`;
  document.body.appendChild(m);
}

function openSheet(num) {
  const m = DB[curPlat];
  const s = m.sheets.find(x => x.n === String(num));
  const parts = (s ? s.c : "Нет описания").split(". ").filter(Boolean);
  const body = parts.map(pt => `<div style="background:#1e293b;border-left:3px solid #38bdf8;padding:10px;margin-bottom:8px;border-radius:6px;font-size:14px;">⚡ ${pt}</div>`).join("");
  showModal(`${m.name} — Лист ${s ? s.n : num}: ${s ? s.t : ""}`, body);
}

function openKeyGen() {
  const html = `
    <div class="desc" style="margin-bottom:10px;">Калькулятор сервисного пароля Hencon HSF (введите 4 или 6 цифр кода с дисплея):</div>
    <div class="row"><input id="kgIn" type="number" placeholder="Код с экрана..." style="flex:1;"><button class="btn b-warn" onclick="calcKg()">Расчёт</button></div>
    <div id="kgOut" style="margin-top:12px;font-size:16px;font-weight:700;color:#4ade80;"></div>`;
  showModal("🔑 KeyGen — Сервисный доступ HSF", html);
}

function calcKg() {
  const v = parseInt(document.getElementById("kgIn").value, 10);
  if (isNaN(v)) return;
  const p1 = ((v * 3 + 1729) % 9000) + 1000;
  const p2 = ((v ^ 0x5A3) % 9000) + 1000;
  document.getElementById("kgOut").innerHTML = `Уровень 2 (Сервис): <span style="color:#fbbf24;">${p1}</span> &nbsp;|&nbsp; Уровень 3 (Инженер): <span style="color:#38bdf8;">${p2}</span>`;
}

function runAI(query) {
  const m = DB[curPlat];
  const q = String(query || "").trim().toLowerCase();
  const up = q.toUpperCase();
  const box = document.getElementById("aiRes");
  if (!box) return;
  if (!q) { box.innerHTML = `<div class="desc">Введите реле (K...), предохранитель (F... / Fu...), пин или симптом. ИИ ищет строго по <b>${m.name}</b>.</div>`; return; }

  const fHit = up.match(/\bFU?\d+\b/);
  if (fHit && m.fuses[fHit]) {
    const f = m.fuses[fHit];
    box.innerHTML = `<div class="card" style="border-color:#fbbf24;"><b>${f.t}</b><div class="desc">${f.d}</div><div style="background:#052e16;color:#86efac;padding:8px;border-radius:6px;margin-top:8px;font-size:13px;">${f.o}</div></div>`;
    return;
  }
  const kHit = up.match(/\bK\d+\b/);
  if (kHit && m.relays[kHit]) {
    const r = m.relays[kHit];
    box.innerHTML = `<div class="card" style="border-color:#38bdf8;"><b>${r.t}</b><div class="desc">${r.d}</div><div style="background:#052e16;color:#86efac;padding:8px;border-radius:6px;margin-top:8px;font-size:13px;">${r.o}</div></div>`;
    return;
  }
  const words = q.split(/\s+/).filter(w => w.length > 1);
  let out = "";
  m.errors.filter(e => words.some(w => (e.e + e.c).toLowerCase().includes(w))).forEach(e => {
    out += `<div class="card" style="border-color:#ef4444;"><b>⚠️ ${e.e}</b><div class="desc">${e.c}</div></div>`;
  });
  m.pins.filter(p => words.some(w => (p.p + p.b + p.c).toLowerCase().includes(w))).forEach(p => {
    out += `<div class="card" style="border-color:#fbbf24;"><b>📍 ${p.p} — ${p.b}</b><div class="desc">${p.c}</div></div>`;
  });
  m.sheets.filter(s => words.some(w => (s.n + s.t + s.c).toLowerCase().includes(w))).slice(0, 6).forEach(s => {
    out += `<div class="card"><b>Лист ${s.n} — ${s.t}</b><div class="desc">${s.c}</div><button class="btn" style="margin-top:8px;" onclick="openSheet('${s.n}')">Открыть чертёж</button></div>`;
  });
  box.innerHTML = out || `<div class="card"><b>В базе ${m.name} совпадений нет</b><div class="desc">Попробуйте указать номер листа, реле (K...) или предохранителя (F...).</div></div>`;
}

function draw() {
  const m = DB[curPlat];
  document.title = m.name;
  document.getElementById("tab-s").textContent = `⚡ Схемы (${m.sheets.length})`;
  const q = document.getElementById("q").value.trim().toLowerCase();
  const app = document.getElementById("app");
  app.innerHTML = "";

  if (curTab === "s") {
    m.sheets.filter(s => !q || (s.n + s.b + s.t + s.c).toLowerCase().includes(q)).forEach(s => {
      app.innerHTML += `<div class="card"><span class="badge">Лист ${s.n} • ${s.b}</span><b>${s.t}</b><div class="desc">${s.c}</div><button class="btn" style="margin-top:8px;" onclick="openSheet('${s.n}')">Чертёж</button></div>`;
    });
  } else if (curTab === "p") {
    m.pins.filter(p => !q || (p.p + p.b + p.c).toLowerCase().includes(q)).forEach(p => {
      app.innerHTML += `<div class="card" style="border-color:#38bdf844;"><span class="badge">${p.b}</span><b>${p.p}</b><div class="desc">${p.c}</div></div>`;
    });
  } else if (curTab === "d") {
    m.errors.filter(e => !q || (e.e + e.b + e.c).toLowerCase().includes(q)).forEach(e => {
      app.innerHTML += `<div class="card" style="border-color:#ef444466;"><span class="badge" style="color:#f87171;">${e.b}</span><b>${e.e}</b><div class="desc">${e.c}</div></div>`;
    });
  } else if (curTab === "w") {
    DICT_BASE.filter(w => !q || (w.k + w.v).toLowerCase().includes(q)).forEach(w => {
      app.innerHTML += `<div class="card"><b>${w.k}</b><div class="desc">${w.v}</div></div>`;
    });
  } else if (curTab === "e") {
    app.innerHTML += `<div class="card" style="border-color:#fbbf24;background:#1c1917;"><b>🚜 Эвакуация и обходы — ${m.name}</b><div class="desc">Проверенные перемычки строго по распиновке этой машины (ставить через предохранитель 5А).</div></div>`;
    m.evac.forEach(tr => {
      const btns = (tr.l || []).map(n => `<button class="btn" style="margin-right:6px;margin-top:8px;" onclick="openSheet('${n}')">Лист ${n}</button>`).join("");
      app.innerHTML += `<div class="card" style="border-color:#ef4444;"><b style="color:#f87171;">${tr.h}</b>
        <div style="background:#1e293b;border-left:3px solid #22c55e;padding:8px;margin-top:6px;font-size:13px;"><b style="color:#4ade80;display:inline;">ОТКУДА:</b> ${tr.from}</div>
        <div style="background:#1e293b;border-left:3px solid #fbbf24;padding:8px;margin-top:6px;font-size:13px;"><b style="color:#fbbf24;display:inline;">КУДА:</b> ${tr.to}</div>
        <div class="desc" style="margin-top:6px;">${tr.body}</div><div>${btns}</div></div>`;
    });
  } else if (curTab === "i") {
    app.innerHTML = `<div class="card"><b>🤖 ИИ</b><div class="desc" style="margin-bottom:8px;">Изолированный поиск строго по платформе: <b>${m.name}</b></div>
      <div class="row"><input id="aiInp" type="text" placeholder="Введите реле (K...), пред (F...) или узел..." style="flex:1;" onkeydown="if(event.key==='Enter')runAI(this.value)"><button class="btn" onclick="runAI(document.getElementById('aiInp').value)">Найти</button></div></div><div id="aiRes"></div>`;
    runAI("");
  }
}

const initGrp = localStorage.getItem("cur_grp") || DB[curPlat].group;
document.getElementById("grpSel").value = initGrp;
fillPlats(initGrp);
draw();
</script>

<script>
(() => {
  const qEl = document.getElementById("q");
  if (qEl && !document.getElementById("clearQ")) {
    const wrap = document.createElement("div");
    wrap.style.cssText = "position:relative;margin-top:8px;";
    qEl.style.marginTop = "0";
    qEl.style.paddingRight = "36px";
    qEl.parentNode.insertBefore(wrap, qEl);
    wrap.appendChild(qEl);

    const clr = document.createElement("button");
    clr.id = "clearQ";
    clr.textContent = "✕";
    clr.style.cssText = "position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:#2dd4bf;font-size:17px;font-weight:700;cursor:pointer;";
    clr.onclick = () => { qEl.value = ""; draw(); };
    wrap.appendChild(clr);
  }

  const _origDraw = window.draw;
  window.draw = function() {
    const qRaw = (document.getElementById("q")?.value || "").trim().toLowerCase();
    if (!qRaw) return _origDraw();

    const m = DB[curPlat];
    const app = document.getElementById("app");
    app.innerHTML = "";
    const words = qRaw.split(/[\s\-]+/).filter(Boolean);
    const match = (txt) => words.every(w => String(txt || "").toLowerCase().includes(w));
    let count = 0;

    (m.evac || []).filter(e => match(e.h + " " + e.from + " " + e.to + " " + e.body)).forEach(tr => {
      count++;
      app.innerHTML += `<div class="card" style="border-color:#ef4444;"><span class="badge" style="color:#f87171;">🚜 Эвакуация / Обход</span><b style="color:#f87171;">${tr.h}</b><div class="desc"><b>ОТКУДА:</b> ${tr.from}\n<b>КУДА:</b> ${tr.to}\n${tr.body}</div></div>`;
    });

    (m.pins || []).filter(p => match(p.p + " " + p.b + " " + p.c)).forEach(p => {
      count++;
      app.innerHTML += `<div class="card" style="border-color:#fbbf24;"><span class="badge">📍 Пин / Клемма • ${p.b}</span><b>${p.p}</b><div class="desc">${p.c}</div></div>`;
    });

    Object.entries(m.fuses || {}).filter(([k, f]) => match(k + " " + f.t + " " + f.d + " " + f.o)).forEach(([k, f]) => {
      count++;
      app.innerHTML += `<div class="card" style="border-color:#f59e0b;"><span class="badge">⚡ Предохранитель</span><b>${f.t}</b><div class="desc">${f.d}\n${f.o}</div></div>`;
    });

    Object.entries(m.relays || {}).filter(([k, r]) => match(k + " " + r.t + " " + r.d + " " + r.o)).forEach(([k, r]) => {
      count++;
      app.innerHTML += `<div class="card" style="border-color:#38bdf8;"><span class="badge">🔌 Реле</span><b>${r.t}</b><div class="desc">${r.d}\n${r.o}</div></div>`;
    });

    (m.errors || []).filter(e => match(e.e + " " + e.b + " " + e.c)).forEach(e => {
      count++;
      app.innerHTML += `<div class="card" style="border-color:#ef4444;"><span class="badge" style="color:#f87171;">⚠️ Ошибка • ${e.b}</span><b>${e.e}</b><div class="desc">${e.c}</div></div>`;
    });

    (m.sheets || []).filter(s => match(s.n + " " + s.b + " " + s.t + " " + s.c)).forEach(s => {
      count++;
      app.innerHTML += `<div class="card"><span class="badge">⚡ Лист ${s.n} • ${s.b}</span><b>${s.t}</b><div class="desc">${s.c}</div><button class="btn" style="margin-top:8px;" onclick="openSheet('${s.n}')">Чертёж</button></div>`;
    });

    if (!count) {
      app.innerHTML = `<div class="card"><b>По запросу «${qRaw}» в ${m.name} ничего не найдено</b><div class="desc">Нажмите ✕ справа в строке поиска, чтобы вернуться ко всем схемам.</div></div>`;
    }
  };
  if (document.getElementById("q")?.value) window.draw();
})();
</script>

<script>
(() => {
  window.runAI = function(query) {
    const m = DB[curPlat];
    const kbList = (window.AI_KB && window.AI_KB[curPlat]) ? window.AI_KB[curPlat] : [];
    const q = String(query || "").trim().toLowerCase();
    const up = q.toUpperCase();
    const box = document.getElementById("aiRes");
    if (!box) return;

    const chips = kbList.map(item =>
      `<button class="btn b2" style="margin:0 6px 6px 0;font-size:12px;" onclick="document.getElementById('aiInp').value='${item.title.replace(/'/g,"")}';runAI('${item.tags}')">${item.title}</button>`
    ).join("");

    if (!q) {
      box.innerHTML = `<div style="margin-bottom:10px;">${chips}</div><div class="desc">Нажмите на ситуацию выше или опишите проблему своими словами (например: <i>«обрыв датчика»</i>, <i>«не едет»</i>, <i>«F106»</i>, <i>«K40»</i>). ИИ ищет строго по <b>${m.name}</b>.</div>`;
      return;
    }

    const words = q.split(/[\s,\-\.\?\!]+/).filter(w => w.length > 1);
    let out = `<div style="margin-bottom:10px;">${chips}</div>`;

    const fHit = up.match(/\bFU?\d+\b/);
    if (fHit && m.fuses && m.fuses[fHit]) {
      const f = m.fuses[fHit];
      out += `<div class="card" style="border-color:#fbbf24;"><b>⚡ ${f.t}</b><div class="desc">${f.d}</div><div style="background:#052e16;color:#86efac;padding:8px;border-radius:6px;margin-top:8px;font-size:13px;">${f.o}</div></div>`;
    }

    const kHit = up.match(/\bK\d+\b/);
    if (kHit && m.relays && m.relays[kHit]) {
      const r = m.relays[kHit];
      out += `<div class="card" style="border-color:#38bdf8;"><b>🔌 ${r.t}</b><div class="desc">${r.d}</div><div style="background:#052e16;color:#86efac;padding:8px;border-radius:6px;margin-top:8px;font-size:13px;">${r.o}</div></div>`;
    }

    const matchedKb = kbList.filter(item =>
      words.some(w => item.tags.some(tg => w.includes(tg) || tg.includes(w)) || item.title.toLowerCase().includes(w) || item.check.toLowerCase().includes(w))
    );

    matchedKb.forEach(item => {
      const btns = (item.sheets || []).map(n => `<button class="btn" style="margin:8px 6px 0 0;" onclick="openSheet('${n}')">Лист ${n}</button>`).join("");
      out += `<div class="card" style="border-color:#00a88f;">
        <b style="color:#2dd4bf;font-size:15.5px;">${item.title}</b>
        <div style="background:#071318;border-left:3px solid #38bdf8;padding:7px 9px;margin-top:6px;font-size:13px;"><b style="color:#38bdf8;display:inline;">ГДЕ ИСКАТЬ:</b> ${item.where}</div>
        <div style="background:#071318;border-left:3px solid #fbbf24;padding:7px 9px;margin-top:6px;font-size:13px;white-space:pre-line;"><b style="color:#fbbf24;display:inline;">ПРОВЕРКА ЦЕПИ / ОБРЫВА:</b>\n${item.check}</div>
        <div style="background:#052e16;border-left:3px solid #22c55e;padding:7px 9px;margin-top:6px;font-size:13px;color:#86efac;"><b style="color:#4ade80;display:inline;">АВАРИЙНЫЙ ОБХОД В ШАХТЕ:</b> ${item.bypass}</div>
        <div>${btns}</div>
      </div>`;
    });

    (m.pins || []).filter(p => words.some(w => (p.p + " " + p.b + " " + p.c).toLowerCase().includes(w))).forEach(p => {
      out += `<div class="card" style="border-color:#fbbf2444;"><b>📍 ${p.p} — ${p.b}</b><div class="desc">${p.c}</div></div>`;
    });

    (m.sheets || []).filter(s => words.some(w => (s.n + " " + s.t + " " + s.c).toLowerCase().includes(w))).slice(0, 4).forEach(s => {
      out += `<div class="card"><b>Лист ${s.n} — ${s.t}</b><div class="desc">${s.c}</div><button class="btn" style="margin-top:8px;" onclick="openSheet('${s.n}')">Чертёж</button></div>`;
    });

    if (out === `<div style="margin-bottom:10px;">${chips}</div>`) {
      out += `<div class="card"><b>По запросу «${q}» в ${m.name} точных совпадений нет</b><div class="desc">Попробуйте выбрать одну из ситуаций кнопками выше или вбить номер листа, пин, реле (K...) или предохранитель (F...).</div></div>`;
    }
    box.innerHTML = out;
  };
  if (curTab === "i") window.runAI("");
})();
</script>

<script>
function selCab(id) {
  var tpl = window.CABINET_TEMPLATES["HENCON_TUG_EMR3"];
  var ov = (window.BOARD_CABINET_OVERRIDES && window.BOARD_CABINET_OVERRIDES[curPlat]) || {};

  var it = all.find(function(x){ return x.id === id; });
  if (!it) return;
  if (ov.items && ov.items[id]) it = Object.assign({}, it, ov.items[id]);
  document.querySelectorAll(".rel-box,.fuse-box,.emr-ecu,.term-box").forEach(function(el){ el.classList.remove("act"); });
  var el = document.getElementById("cab-el-" + id);
  if (el) el.classList.add("act");
  var box = document.getElementById("cab-inspector");
  if (box) {
    var b = it.amp ? '<span class="cab-badge">Номинал: ' + it.amp + '</span>' : '<span class="cab-badge">Узел / Шина</span>';
    box.innerHTML = '<div class="cab-insp-head"><span style="font-size:15px;font-weight:700;color:#f8fafc">' + it.id + ' — ' + it.name + '</span>' + b + '</div>' +
      '<div style="font-size:13px;color:#34d399;margin-bottom:3px"><b>⬅ ОТКУДА:</b> ' + it.from + '</div>' +
      '<div style="font-size:13px;color:#fbbf24;margin-bottom:4px"><b>➡ КУДА:</b> ' + it.to + '</div>' +
      '<div style="font-size:12px;color:#94a3b8">' + (it.note || '') + '</div>';
  }
}

function openCab() {
  document.querySelectorAll(".nb").forEach(function(b){ b.classList.remove("act"); });
  var btn = document.getElementById("tab-c");
  if (btn) btn.classList.add("act");
  var app = document.getElementById("app");
  var qEl = document.getElementById("q");
  var q = (qEl ? qEl.value : "").trim().toLowerCase();
  var m = (typeof DB !== "undefined" && DB[curPlat]) ? DB[curPlat] : {};
  var tpl = window.CABINET_TEMPLATES["HENCON_TUG_EMR3"];
  var ov = (window.BOARD_CABINET_OVERRIDES && window.BOARD_CABINET_OVERRIDES[curPlat]) || {};
  function match(it) { return !q || [it.id, it.amp, it.name, it.from, it.to, it.note].join(" ").toLowerCase().indexOf(q) !== -1; }
  function getIt(it) { return (ov.items && ov.items[it.id]) ? Object.assign({}, it, ov.items[it.id]) : it; }

  var rHtml = tpl.relays.map(function(r) {
    var it = getIt(r);
    return '<div id="cab-el-' + it.id + '" class="rel-box ' + (match(it)?'':'cab-dim') + '" onmouseenter="selCab(\'' + it.id + '\')" onclick="selCab(\'' + it.id + '\')"><div class="rel-top"></div><div class="rel-lbl">' + it.id + '</div></div>';
  }).join("");

  var fHtml = tpl.fuses.map(function(f) {
    var it = getIt(f);
    return '<div id="cab-el-' + it.id + '" class="fuse-box ' + it.cls + ' ' + (match(it)?'':'cab-dim') + '" onmouseenter="selCab(\'' + it.id + '\')" onclick="selCab(\'' + it.id + '\')"><span style="font-size:10px;font-weight:800;background:rgba(0,0,0,.45);padding:1px 4px;border-radius:3px">' + it.id + '</span><span style="font-size:12px;font-weight:900">' + it.amp + '</span></div>';
  }).join("");

  var tHtml = tpl.terms.map(function(t) {
    var it = getIt(t);
    return '<div id="cab-el-' + it.id + '" class="term-box ' + (match(it)?'':'cab-dim') + '" onmouseenter="selCab(\'' + it.id + '\')" onclick="selCab(\'' + it.id + '\')">' + it.id + ' — ' + it.name + '</div>';
  }).join("");

  var emr = getIt(tpl.right.find(function(x){ return x.id === "EMR3"; }));
  var k3 = getIt(tpl.right.find(function(x){ return x.id === "K3"; }));
  var noteTxt = ov.notes ? ' • ' + ov.notes : '';

  app.innerHTML = '<div class="cab-wrap">' +
    '<div><div style="font-weight:700;color:#38bdf8;font-size:15px">⚡ ' + tpl.title + '</div><div style="font-size:12px;color:#94a3b8">' + (m.name || curPlat) + noteTxt + '</div></div>' +
    '<div id="cab-inspector" class="cab-insp"><div style="color:#94a3b8;font-size:13px;padding-top:18px;text-align:center">👆 Наведите курсор или нажмите на любое <b>реле</b>, <b>предохранитель</b>, блок <b>BOSCH EMR</b> или <b>клемму</b>, чтобы увидеть номинал и цепь «Откуда ➔ Куда».</div></div>' +
    '<div class="cab-grid"><div class="cab-left">' +
    '<div><div class="cab-row-title">Верхний ряд: Колодка реле (K1 – K26)</div><div class="cab-relays">' + rHtml + '</div></div>' +
    '<div><div class="cab-row-title">Средняя рейка: Автопредохранители (F1 – F44)</div><div class="cab-fuses">' + fHtml + '</div></div>' +
    '<div><div class="cab-row-title">Нижняя шина: Силовые и контрольные клеммы</div><div class="cab-terms">' + tHtml + '</div></div>' +
    '</div><div class="cab-emr"><div class="cab-row-title">Правый отсек (за перегородкой)</div>' +
    '<div id="cab-el-' + emr.id + '" class="emr-ecu ' + (match(emr)?'':'cab-dim') + '" onmouseenter="selCab(\'' + emr.id + '\')" onclick="selCab(\'' + emr.id + '\')"><div style="font-size:11px;color:#94a3b8">DEUTZ ENGINE ECU</div><div style="font-size:18px;font-weight:900;margin:6px 0;color:#38bdf8">BOSCH EMR-3</div><div style="font-size:11px;color:#cbd5e1">Разъёмы A / B • CAN1 J1939</div></div>' +

<script>
window.setCabZone = function(z) {
  window.CAB_ZONE = z;
  if (typeof openCab === "function") openCab();
};

window.selCab = function(id) {
  var plat = (typeof curPlat !== "undefined") ? curPlat : "P1402";
  var tpl = (window.CAB_ZONE === "TR" && window.TRAILER_TEMPLATES[plat]) ? window.TRAILER_TEMPLATES[plat] : window.CABINET_TEMPLATES["HENCON_TUG_EMR3"];
  var ov = (window.BOARD_CABINET_OVERRIDES && window.BOARD_CABINET_OVERRIDES[plat]) || {};
  var all = tpl.relays.concat(tpl.fuses, tpl.right, tpl.terms, tpl.mega || []);
  var it = all.find(function(x){ return x.id === id; });
  if (!it) return;
  if (ov.items && ov.items[id]) it = Object.assign({}, it, ov.items[id]);
  document.querySelectorAll(".rel-box,.fuse-box,.emr-ecu,.term-box").forEach(function(el){ el.classList.remove("act"); });
  var el = document.getElementById("cab-el-" + id);
  if (el) el.classList.add("act");
  var box = document.getElementById("cab-inspector");
  if (box) {
    var b = it.amp ? '\u003cspan class="cab-badge"\u003eНоминал: ' + it.amp + '\u003c/span\u003e' : '\u003cspan class="cab-badge"\u003eУзел / Шина\u003c/span\u003e';
    box.innerHTML = '\u003cdiv class="cab-insp-head"\u003e\u003cspan style="font-size:15px;font-weight:700;color:#f8fafc"\u003e' + it.id + ' — ' + it.name + '\u003c/span\u003e' + b + '\u003c/div\u003e' +
      '\u003cdiv style="font-size:13px;color:#34d399;margin-bottom:3px"\u003e\u003cb\u003e⬅ ОТКУДА:\u003c/b\u003e ' + it.from + '\u003c/div\u003e' +
      '\u003cdiv style="font-size:13px;color:#fbbf24;margin-bottom:4px"\u003e\u003cb\u003e➡ КУДА:\u003c/b\u003e ' + it.to + '\u003c/div\u003e' +
      '\u003cdiv style="font-size:12px;color:#94a3b8"\u003e' + (it.note || '') + '\u003c/div\u003e';
  }
};

window.openCab = function() {
  document.querySelectorAll(".nb").forEach(function(b){ b.classList.remove("act"); });
  var btn = document.getElementById("tab-c");
  if (btn) btn.classList.add("act");
  var app = document.getElementById("app");
  var qEl = document.getElementById("q");
  var q = (qEl ? qEl.value : "").trim().toLowerCase();
  var plat = (typeof curPlat !== "undefined") ? curPlat : "P1402";
  var m = (typeof DB !== "undefined" && DB[plat]) ? DB[plat] : {name: plat};
  var hasTr = !!(window.TRAILER_TEMPLATES && window.TRAILER_TEMPLATES[plat]);
  if (!hasTr) window.CAB_ZONE = "TUG";
  var tpl = (window.CAB_ZONE === "TR" && hasTr) ? window.TRAILER_TEMPLATES[plat] : window.CABINET_TEMPLATES["HENCON_TUG_EMR3"];
  var ov = (window.BOARD_CABINET_OVERRIDES && window.BOARD_CABINET_OVERRIDES[plat]) || {};

  function match(it) { return !q || [it.id, it.amp, it.name, it.from, it.to, it.note].join(" ").toLowerCase().indexOf(q) !== -1; }
  function getIt(it) { return (ov.items && ov.items[it.id]) ? Object.assign({}, it, ov.items[it.id]) : it; }

  var rHtml = tpl.relays.map(function(r) {
    var it = getIt(r);
    return '\u003cdiv id="cab-el-' + it.id + '" class="rel-box ' + (match(it)?'':'cab-dim') + '" onmouseenter="selCab(\'' + it.id + '\')" onclick="selCab(\'' + it.id + '\')"\u003e\u003cdiv class="rel-top"\u003e\u003c/div\u003e\u003cdiv class="rel-lbl"\u003e' + it.id + '\u003c/div\u003e\u003c/div\u003e';
  }).join("");

  var fHtml = tpl.fuses.map(function(f) {
    var it = getIt(f);
    return '\u003cdiv id="cab-el-' + it.id + '" class="fuse-box ' + it.cls + ' ' + (match(it)?'':'cab-dim') + '" onmouseenter="selCab(\'' + it.id + '\')" onclick="selCab(\'' + it.id + '\')"\u003e\u003cspan style="font-size:10px;font-weight:800;background:rgba(0,0,0,.45);padding:1px 4px;border-radius:3px"\u003e' + it.id + '\u003c/span\u003e\u003cspan style="font-size:12px;font-weight:900"\u003e' + it.amp + '\u003c/span\u003e\u003c/div\u003e';
  }).join("");

  var tHtml = tpl.terms.map(function(t) {
    var it = getIt(t);
    return '\u003cdiv id="cab-el-' + it.id + '" class="term-box ' + (match(it)?'':'cab-dim') + '" onmouseenter="selCab(\'' + it.id + '\')" onclick="selCab(\'' + it.id + '\')"\u003e' + it.id + ' — ' + it.name + '\u003c/div\u003e';
  }).join("");

  var megaHtml = (tpl.mega || []).map(function(mg) {
    var it = getIt(mg);
    return '\u003cdiv id="cab-el-' + it.id + '" class="term-box ' + (match(it)?'':'cab-dim') + '" style="border-color:#f87171;color:#fecaca;text-align:center" onmouseenter="selCab(\'' + it.id + '\')" onclick="selCab(\'' + it.id + '\')"\u003e⚡ ' + it.id + ' (' + it.amp + ')\u003c/div\u003e';
  }).join("");

  var ecu = getIt(tpl.right.find(function(x){ return x.type === "ecu"; }));
  var sub = getIt(tpl.right.find(function(x){ return x.type !== "ecu"; }));
  var noteTxt = ov.notes ? ' • ' + ov.notes : '';

  var zoneTabs = hasTr ? '\u003cdiv style="display:flex;gap:6px"\u003e' +
    '\u003cbutton class="btn" style="' + (window.CAB_ZONE==="TUG"?"border-color:#38bdf8;background:#0c4a6e;color:#fff":"") + '" onclick="setCabZone(\'TUG\')"\u003e🚛 Шкаф тягача (Encl. 1)\u003c/button\u003e' +
    '\u003cbutton class="btn" style="' + (window.CAB_ZONE==="TR"?"border-color:#38bdf8;background:#0c4a6e;color:#fff":"") + '" onclick="setCabZone(\'TR\')"\u003e🏗 Шкаф прицепа (Encl. 3)\u003c/button\u003e' +
    '\u003c/div\u003e' : '';

  app.innerHTML = '\u003cdiv class="cab-wrap"\u003e' +
    '\u003cdiv style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px"\u003e' +
    '\u003cdiv\u003e\u003cdiv style="font-weight:700;color:#38bdf8;font-size:15px"\u003e⚡ ' + tpl.title + '\u003c/div\u003e\u003cdiv style="font-size:12px;color:#94a3b8"\u003e' + (m.name || plat) + noteTxt + '\u003c/div\u003e\u003c/div\u003e' + zoneTabs + '\u003c/div\u003e' +
    '\u003cdiv id="cab-inspector" class="cab-insp"\u003e\u003cdiv style="color:#94a3b8;font-size:13px;padding-top:18px;text-align:center"\u003e👆 Наведите курсор или нажмите на любое реле, предохранитель, мега-пред или клемму (верхний поиск фильтрует щит вживую).\u003c/div\u003e\u003c/div\u003e' +
    '\u003cdiv class="cab-grid"\u003e\u003cdiv class="cab-left"\u003e' +
    '\u003cdiv\u003e\u003cdiv class="cab-row-title"\u003eВерхний ряд: Колодка реле\u003c/div\u003e\u003cdiv class="cab-relays"\u003e' + rHtml + '\u003c/div\u003e\u003c/div\u003e' +
    '\u003cdiv\u003e\u003cdiv class="cab-row-title"\u003eСредняя рейка: Автопредохранители\u003c/div\u003e\u003cdiv class="cab-fuses"\u003e' + fHtml + '\u003c/div\u003e\u003c/div\u003e' +
    '\u003cdiv\u003e\u003cdiv class="cab-row-title"\u003eНижняя шина: Силовые и контрольные клеммы / разъёмы\u003c/div\u003e\u003cdiv class="cab-terms"\u003e' + tHtml + '\u003c/div\u003e\u003c/div\u003e' +
    '\u003c/div\u003e\u003cdiv class="cab-emr"\u003e\u003cdiv class="cab-row-title"\u003eПравый отсек / Контроллеры\u003c/div\u003e' +
    '\u003cdiv id="cab-el-' + ecu.id + '" class="emr-ecu ' + (match(ecu)?'':'cab-dim') + '" onmouseenter="selCab(\'' + ecu.id + '\')" onclick="selCab(\'' + ecu.id + '\')"\u003e\u003cdiv style="font-size:11px;color:#94a3b8"\u003eCONTROL UNIT\u003c/div\u003e\u003cdiv style="font-size:16px;font-weight:900;margin:6px 0;color:#38bdf8"\u003e' + ecu.name + '\u003c/div\u003e\u003c/div\u003e' +
    '\u003cdiv id="cab-el-' + sub.id + '" class="rel-box ' + (match(sub)?'':'cab-dim') + '" style="width:100%;height:auto;padding:8px" onmouseenter="selCab(\'' + sub.id + '\')" onclick="selCab(\'' + sub.id + '\')"\u003e\u003cdiv style="font-size:11px;color:#94a3b8;margin-bottom:4px"\u003e' + sub.name + '\u003c/div\u003e\u003cdiv class="rel-lbl"\u003e' + sub.id + ' (' + sub.amp + ')\u003c/div\u003e\u003c/div\u003e' +
    (megaHtml ? '\u003cdiv style="display:flex;flex-direction:column;gap:4px"\u003e\u003cdiv class="cab-row-title"\u003eСиловые мега-преды\u003c/div\u003e' + megaHtml + '\u003c/div\u003e' : '') +
    '\u003c/div\u003e\u003c/div\u003e\u003c/div\u003e';
};
</script>
