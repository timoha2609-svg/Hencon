<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>АВТОЭЛЕКТРИК PRO</title><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif}body{background:#090d16;color:#f8fafc;padding-bottom:74px}header{background:#0f172a;border-bottom:2px solid #38bdf8;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;font-size:16px;color:#38bdf8}.logo span{color:#fbbf24}.pro-badge{background:#14532d;border:1px solid #22c55e;color:#4ade80;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:800;cursor:pointer}.pro-badge.off{background:#7f1d1d;border-color:#ef4444;color:#fca5a5}.bar{background:#0f172a;padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid #1e293b}select,input{background:#1e293b;color:#fff;border:1px solid #334155;border-radius:8px;padding:7px 10px;font-size:13px}select{font-weight:700;color:#38bdf8}input{flex:1;min-width:140px}#app{padding:10px 12px;max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:10px}.card{background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:10px}.btn{background:#1e293b;color:#e2e8f0;border:1px solid #475569;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer}.btn.act{background:#0c4a6e;border-color:#38bdf8;color:#fff}.fuse-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.f-item{min-width:60px;padding:6px 5px;border-radius:6px;text-align:center;cursor:pointer;border:1.5px solid rgba(255,255,255,.25);font-family:monospace;font-weight:800;font-size:12px}.f-item.act,.r-item.act{outline:2.5px solid #fff}.f5{background:#9a3412}.f10{background:#b91c1c}.f15{background:#1d4ed8}.f20{background:#a16207}.f30{background:#15803d}.r-item{min-width:68px;padding:8px 6px;border-radius:6px;background:#1e293b;border:1.5px solid #64748b;text-align:center;cursor:pointer;font-family:monospace;font-weight:800;font-size:12px;color:#fbbf24}nav{position:fixed;bottom:0;left:0;right:0;background:#0f172a;border-top:1.5px solid #334155;display:flex;padding:5px 4px}.nb{flex:1;background:none;border:none;color:#94a3b8;font-size:11px;font-weight:700;padding:6px 2px;cursor:pointer}.nb.act{color:#38bdf8;background:#1e293b;border-radius:8px}@keyframes flow{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}.wire-anim{stroke-dasharray:8 4;animation:flow 1s linear infinite}</style><style>
.fusebox-case {
  background: linear-gradient(180deg, #111827 0%, #090d16 100%);
  border: 2.5px solid #334155;
  border-radius: 14px;
  padding: 12px;

}

  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(64px, 1fr));

}

  border: 2px solid rgba(255,255,255,0.28);
  box-shadow: inset 0 2px 0 rgba(255,255,255,0.25), 0 3px 6px rgba(0,0,0,0.6);
  transition: transform 0.1s;

}
.blade-fuse:hover { transform: translateY(-2px); }
.blade-fuse.act { outline: 3px solid #38bdf8; transform: scale(1.06); z-index: 2; }
.blade-fuse.dim { opacity: 0.22; filter: grayscale(0.8); }
.bf-amp { font-family: monospace; font-size: 14px; font-weight: 900; line-height: 1.1; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
.bf-id { font-family: monospace; font-size: 10px; font-weight: 700; opacity: 0.9; margin-top: 2px; }
.bf-tag { font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.88; margin-top: 2px; }
.c-5a { background: #ea580c; color: #fff; }
.c-75a { background: #78350f; color: #fef3c7; }
.c-10a { background: #dc2626; color: #fff; }
.c-15a { background: #2563eb; color: #fff; }
.c-20a { background: #ca8a04; color: #fff; }
.c-25a { background: #cbd5e1; color: #0f172a; }
.c-30a { background: #16a34a; color: #fff; }

.c-rez { background: #1e293b; color: #64748b; border-style: dashed; }

.relay-box.act { border-color: #38bdf8; outline: 2.5px solid #38bdf8; }
</style>
<style id="pro-garage-css">
#nfs-overlay{position:fixed;inset:0;z-index:9999;background:radial-gradient(circle at 50% 0%,#0f294a 0%,#050914 65%,#02040a 100%);display:flex;align-items:center;justify-content:center;padding:16px;font-family:system-ui,-apple-system,sans-serif;overflow-y:auto}
#nfs-overlay::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(56,189,248,0.06) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,0.06) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.nfs-box{position:relative;width:100%;max-width:920px;background:rgba(10,17,32,0.86);backdrop-filter:blur(18px);border:1px solid rgba(56,189,248,0.35);border-radius:20px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,0.85),inset 0 1px 0 rgba(255,255,255,0.12);animation:nfsPop .35s cubic-bezier(.16,1,.3,1)}
@keyframes nfsPop{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}

.nfs-stage{position:relative;background:radial-gradient(circle at 50% 45%,rgba(14,165,233,0.16),rgba(6,11,25,0.95) 75%);border:1px solid rgba(56,189,248,0.25);border-radius:16px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.nfs-hud-row{background:linear-gradient(135deg,rgba(15,23,42,0.9),rgba(15,23,42,0.6));border:1px solid rgba(148,163,184,0.16);border-left:3px solid #38bdf8;border-radius:12px;padding:12px 14px;transition:transform .2s,border-color .2s}
.nfs-hud-row:hover{border-color:rgba(56,189,248,0.5);transform:translateX(2px)}

.nfs-sel{width:100%;margin-top:6px;padding:9px 12px;border-radius:9px;border:1px solid rgba(56,189,248,0.45);background:#070d19;color:#f8fafc;font-size:13px;font-weight:800;cursor:pointer;outline:none;transition:box-shadow .2s}
.nfs-sel:focus{box-shadow:0 0 0 3px rgba(56,189,248,0.25)}
.nfs-go{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(90deg,#0284c7 0%,#10b981 50%,#059669 100%);background-size:200% auto;color:#fff;font-size:14px;font-weight:900;letter-spacing:1px;cursor:pointer;box-shadow:0 10px 28px rgba(16,185,129,0.35);transition:all .25s}
.nfs-go:hover{background-position:right center;transform:translateY(-1px);box-shadow:0 14px 34px rgba(16,185,129,0.5)}
@keyframes pulseCore{0%,100%{opacity:.75}50%{opacity:1}}
.core-pulse{animation:pulseCore 2.2s infinite ease-in-out}
</style>
</head><body><header><div class="logo">⚡ АВТОЭЛЕКТРИК <span>PRO</span></div><div style="display:flex;align-items:center;gap:6px"><button onclick="openNfsGarage()" style="padding:5px 10px;border-radius:8px;border:1px solid #38bdf8;background:rgba(56,189,248,0.16);color:#38bdf8;font-size:11px;font-weight:900;cursor:pointer">&#9881; ПРИБОРКА / ГАРАЖ</button><div id="proBtn" class="pro-badge on" style="cursor:default;background:rgba(16,185,129,0.18);border-color:#10b981;color:#34d399">FULL &bull; 28</div></div></header><div class="bar"><div id="active-car-badge" onclick="openNfsGarage()" title="Нажмите для смены авто в гараже" style="padding:7px 12px;border-radius:8px;border:1px solid #38bdf8;background:#0f172a;color:#38bdf8;font-size:13px;font-weight:900;cursor:pointer">Lada Vesta</div><input id="q" placeholder="Поиск: насос, F3, K2, пин..." oninput="draw()"></div><div id="app"></div><nav><button class="nb act" id="t-cab" onclick="setTab('cab')">⚡ Щиты и Схемы</button><button class="nb" id="t-err" onclick="setTab('err')">⚠️ Коды OBD2</button><button class="nb" id="t-pin" onclick="setTab('pin')">🔌 Пины ЭБУ</button><button class="nb" id="t-med" onclick="setTab('med')">🩺 Болячки</button><button class="nb" id="t-wiz" onclick="setTab('wiz')">🧭 Прозвонка</button><button class="nb" id="t-my" onclick="setTab('my')">🚘 Мой Авто</button></nav><script>var isPro=true,curCar="VESTA",curTab="cab",curZone="CAB",wizStep=null,CARS={};var CATALOG=[{id:"VESTA",title:"Lada Vesta (1.6/1.8 • М86)",pro:false,url:"cars/vesta.json"},{id:"GRANTA",title:"Lada Granta FL (М74М)",pro:false,url:"cars/granta.json"},{id:"RIO",title:"Kia Rio / Solaris 1.6",pro:false,url:"cars/rio.json"},{id:"POLO",title:"VW Polo / Skoda Rapid 1.6",pro:false,url:"cars/polo.json"},{id:"CAMRY",title:"Toyota Camry XV50/70",pro:false,url:"cars/camry.json"},{id:"JOLION",title:"Haval Jolion 1.5T",pro:false,url:"cars/jolion.json"}];CARS.VESTA={name:"Lada Vesta (ЭБУ М86)",zones:{CAB:{title:"Салонный блок",relays:[{id:"K1",amp:"20A",name:"Обогрев стекла",from:"АКБ +30 / BCM",to:"Нити стекла и зеркал",note:"Проверить 30-87."}],fuses:[{id:"F3",amp:"15A",c:"f15",name:"Бензонасос",from:"Реле K3 (капот)",to:"Насос в баке",note:"Проверять первым."},{id:"F12",amp:"10A",c:"f10",name:"Главное реле и катушки",from:"Замок KL15",to:"Реле K2 и ЭБУ",note:"Нет искры."},{id:"F41",amp:"5A",c:"f5",name:"Разъём OBD-II",from:"АКБ +30",to:"Пин 16 OBD-II",note:"Не работает ELM327."}]},ENG:{title:"Подкапотный блок",relays:[{id:"K2",amp:"30A",name:"Главное реле впрыска",from:"F12 / D4 ЭБУ",to:"Форсунки, ДМРВ",note:"Без K2 нет запуска."},{id:"K3",amp:"20A",name:"Реле бензонасоса",from:"K2 / G2 ЭБУ",to:"Пред F3 -> насос",note:"3 сек при зажигании."}],fuses:[{id:"F4",amp:"30A",c:"f30",name:"Силовой пред ЭБУ",from:"АКБ +30",to:"Реле K2 и K3",note:"Главный пред впрыска."}]}},pins:[{p:"X1-D4",sig:"Выход (-)",name:"Упр. реле K2",to:"Катушка 85 K2"},{p:"X1-G2",sig:"Выход (-)",name:"Упр. реле K3",to:"Катушка 85 K3 -> F3"}]};CARS.GRANTA={name:"Lada Granta FL (М74М)",zones:{CAB:{title:"Салонный блок",relays:[{id:"K1",amp:"20A",name:"Главное реле ДВС",from:"Замок / C2 ЭБУ",to:"Форсунки, катушки",note:"Верхний ряд."}],fuses:[{id:"F12",amp:"15A",c:"f15",name:"Топливный насос",from:"Реле K2",to:"Бензонасос",note:"Нет давления."},{id:"F14",amp:"15A",c:"f15",name:"Катушки и форсунки",from:"Реле K1",to:"Модуль зажигания",note:"Пробой модуля."}]},ENG:{title:"Подкапотные преды",relays:[{id:"K_FAN",amp:"30A",name:"Реле вентилятора",from:"F1 / ЭБУ",to:"Вентилятор",note:"У АКБ."}],fuses:[{id:"F2",amp:"50A",c:"f30",name:"Главный силовой пред",from:"Клемма АКБ",to:"Шина +30",note:"Машина обесточена."}]}},pins:[{p:"X1-C2",sig:"Выход (-)",name:"Упр. реле K1",to:"Катушка K1"}]};CARS.RIO={name:"Kia Rio / Solaris 1.6",zones:{CAB:{title:"Салонный блок",relays:[{id:"R_ACC",amp:"20A",name:"Реле АСС",from:"Замок ACC",to:"Розетки",note:"В блоке."}],fuses:[{id:"MODULE 1",amp:"10A",c:"f10",name:"BCM и иммо",from:"Замок ON",to:"Иммобилайзер",note:"Мигает ключик."}]},ENG:{title:"Подкапотный блок",relays:[{id:"MAIN",amp:"30A",name:"Главное реле ЭБУ",from:"Пин 72 ЭБУ",to:"Форсунки, катушки",note:"Ключевое реле."}],fuses:[{id:"F/PUMP",amp:"15A",c:"f15",name:"Топливный насос",from:"Реле F/PUMP",to:"Бензонасос",note:"Проверять первым."}]}},pins:[{p:"Pin 72",sig:"Выход (-)",name:"Упр. MAIN",to:"Main Relay"}]};CARS.POLO={name:"VW Polo / Rapid 1.6",zones:{CAB:{title:"Салонный блок SC",relays:[{id:"J329",amp:"40A",name:"Реле клеммы 15",from:"BCM J519",to:"Шина KL15",note:"Нет зажигания."}],fuses:[{id:"SC10",amp:"15A",c:"f15",name:"Блок насоса J538",from:"Клемма 30",to:"Насос в баке",note:"Нет топлива."}]},ENG:{title:"Подкапотный блок SB",relays:[{id:"J271",amp:"30A",name:"Главное реле ЭБУ",from:"T94/69 ЭБУ",to:"Катушки, форсунки",note:"Реле впрыска."}],fuses:[{id:"SB8",amp:"30A",c:"f30",name:"Питание J271",from:"АКБ +30",to:"Реле J271",note:"Силовой пред."}]}},pins:[{p:"T94/69",sig:"Выход (-)",name:"Упр. J271",to:"Реле J271"}]};CARS.CAMRY={name:"Toyota Camry XV50/70",zones:{CAB:{title:"Салонный блок",relays:[{id:"IG1",amp:"20A",name:"Реле IG1",from:"Start-Stop",to:"ДВС и АКПП",note:"В блоке."}],fuses:[{id:"ECU-IG1",amp:"10A",c:"f10",name:"Зажигание ЭБУ",from:"Реле IG1",to:"Пин IGSW",note:"Нет запуска."}]},ENG:{title:"Подкапотный блок",relays:[{id:"EFI MAIN",amp:"30A",name:"Главное реле EFI",from:"MREL ЭБУ (+12V)",to:"Форсунки, MAF",note:"Упр. плюсом!"}],fuses:[{id:"INJ",amp:"15A",c:"f15",name:"Катушки и форсунки",from:"EFI MAIN",to:"ДВС 2AR-FE",note:"Нет искры."}]}},pins:[{p:"MREL",sig:"Выход (+12V)",name:"Упр. EFI MAIN",to:"Реле EFI MAIN"}]};CARS.JOLION={name:"Haval Jolion 1.5T",zones:{CAB:{title:"Салонный блок IP",relays:[{id:"R_IG1",amp:"30A",name:"Реле IG1",from:"PEPS",to:"Салон",note:"Start/Stop."}],fuses:[{id:"IF22",amp:"15A",c:"f15",name:"BCM и иммо",from:"B+",to:"Блок BCM",note:"Не видит ключ."}]},ENG:{title:"Подкапотный блок UE",relays:[{id:"K01",amp:"30A",name:"Главное реле ЭБУ",from:"J1-44 ЭБУ",to:"Впрыск, турбина",note:"Основное реле."}],fuses:[{id:"EF18",amp:"15A",c:"f15",name:"Топливный насос",from:"Реле K04",to:"Бензонасос",note:"Проверять первым."}]}},pins:[{p:"J1-44",sig:"Выход (-)",name:"Упр. K01",to:"Реле K01"}]};async function loadCarModule(id){var item=CATALOG.find(x=>x.id===id);if(!item||CARS[id])return;var c=localStorage.getItem("avto_cache_"+id);if(c)CARS[id]=JSON.parse(c);else if(item.url){try{var r=await fetch(item.url);if(r.ok){CARS[id]=await r.json();localStorage.setItem("avto_cache_"+id,JSON.stringify(CARS[id]));}}catch(e){}}}function renderCatalog(){document.getElementById("carSel").innerHTML=CATALOG.map(m=>`<option value="${m.id}" ${m.id===curCar?"selected":""}>${(m.pro&&!isPro)?"🔒 ":"✅ "}${m.title}${m.pro?" [PRO]":" [FREE]"}</option>`).join("");}function togglePro(){isPro=!isPro;var b=document.getElementById("proBtn");b.className=isPro?"pro-badge":"pro-badge off";b.textContent=isPro?"★ PRO АКТИВЕН (Все авто)":"🔒 Демо FREE (Вкл. PRO 99₽)";renderCatalog();draw();}async function selectCar(id){curCar=id;curZone="CAB";await loadCarModule(id);draw();}function setTab(t){curTab=t;document.querySelectorAll(".nb").forEach(b=>b.classList.remove("act"));document.getElementById("t-"+t).classList.add("act");draw();}function selEl(id){var z=CARS[curCar].zones[curZone],it=[...(z.relays||[]),...(z.fuses||[])].find(x=>x.id===id);if(!it)return;document.querySelectorAll(".f-item,.r-item").forEach(e=>e.classList.remove("act"));var el=document.getElementById("el-"+id);if(el)el.classList.add("act");document.getElementById("insp").innerHTML=`<b style="color:#38bdf8;font-size:14px">${it.id} (${it.amp}) — ${it.name}</b><div style="color:#34d399;font-size:12px;margin-top:4px"><b>⬅ ОТКУДА:</b> ${it.from}</div><div style="color:#fbbf24;font-size:12px"><b>➡ КУДА:</b> ${it.to}</div><div style="color:#94a3b8;font-size:11px;margin-top:4px">${it.note}</div>`;}function draw(){var app=document.getElementById("app"),meta=CATALOG.find(x=>x.id===curCar),c=CARS[curCar],q=document.getElementById("q").value.toLowerCase();if(meta&&meta.pro&&!isPro){app.innerHTML=`<div class="card" style="border-color:#fbbf24;text-align:center;padding:22px"><h3 style="color:#fbbf24;margin-bottom:8px">🔒 ${meta.title}</h3><p style="font-size:13px;color:#cbd5e1;margin-bottom:14px">Монтажные блоки, схемы и пины ЭБУ доступны по подписке <b>99 ₽ / месяц</b>.</p><button class="btn act" onclick="togglePro()">Включить демо-доступ PRO (бесплатно)</button></div>`;return;}if(!c)return;if(curTab==="cab"){var z=c.zones[curZone];var rH=(z.relays||[]).filter(x=>!q||(x.id+x.name+x.from+x.to).toLowerCase().includes(q)).map(r=>`<div id="el-${r.id}" class="r-item" onclick="selEl('${r.id}')"><div>${r.id}</div><div style="font-size:10px;color:#94a3b8">${r.amp}</div></div>`).join("");var fH=(z.fuses||[]).filter(x=>!q||(x.id+x.name+x.from+x.to).toLowerCase().includes(q)).map(f=>`<div id="el-${f.id}" class="f-item ${f.c}" onclick="selEl('${f.id}')"><div>${f.id}</div><div>${f.amp}</div></div>`).join("");app.innerHTML=`<div style="display:flex;gap:6px"><button class="btn ${curZone==="CAB"?"act":""}" onclick="curZone='CAB';draw()">🚗 Салонный блок</button><button class="btn ${curZone==="ENG"?"act":""}" onclick="curZone='ENG';draw()">🔥 Подкапотный блок</button></div><div id="insp" class="card" style="border-color:#38bdf8;min-height:76px"><span style="color:#94a3b8;font-size:12px">👆 Нажмите на предохранитель или реле, чтобы увидеть трассу питания.</span></div><div class="card"><div style="font-weight:700;color:#38bdf8;font-size:13px;margin-bottom:8px">${z.title}</div><div style="font-size:11px;color:#94a3b8">Реле:</div><div class="fuse-grid">${rH}</div><div style="font-size:11px;color:#94a3b8;margin-top:10px">Предохранители:</div><div class="fuse-grid">${fH}</div></div>`;}else if(curTab==="sch"){app.innerHTML=`<div class="card"><div style="font-weight:700;color:#38bdf8;font-size:13px;margin-bottom:8px">📐 Схема запуска (${c.name})</div><svg viewBox="0 0 700 170" style="width:100%;height:auto;background: <script>
var ampFilter = "ALL";
function setAmp(a) { ampFilter = a; draw(); }

function getFuseColorCls(amp) {
  var s = String(amp || "").toUpperCase();
  if (s === "5A") return "c-5a";
  if (s === "7.5A") return "c-75a";
  if (s === "10A") return "c-10a";
  if (s === "15A") return "c-15a";
  if (s === "20A") return "c-20a";
  if (s === "25A") return "c-25a";
  if (s === "30A") return "c-30a";
  if (s === "40A" || s === "50A") return "c-40a";
  return "c-rez";
}

function getShortTag(name) {
  var n = String(name || "");
  if (/насос|pump/i.test(n)) return "Насос";
  if (/obd|диагн/i.test(n)) return "OBD-II";
  if (/печк|отопит/i.test(n)) return "Печка";
  if (/ближн/i.test(n)) return "Ближн.";
  if (/дальн/i.test(n)) return "Дальн.";
  if (/габарит/i.test(n)) return "Габар.";
  if (/катуш/i.test(n)) return "Катуш.";
  if (/форсун/i.test(n)) return "Форс.";
  if (/вентил/i.test(n)) return "Вент.";
  if (/стеклоочист|дворн/i.test(n)) return "Дворн.";
  if (/прикур|розет/i.test(n)) return "12В";
  if (/стоп/i.test(n)) return "Стоп";
  if (/подушек|srs/i.test(n)) return "SRS";
  if (/резерв/i.test(n)) return "Пусто";
  return n.split(" ");
}

(function(){
  var prevDraw = window.draw;
  window.draw = function() {
    prevDraw();
    var meta = CATALOG.find(function(x){ return x.id === curCar; });
    if (meta && meta.pro && !isPro) return;
    if (curTab !== "cab" || !CARS[curCar]) return;

    var c = CARS[curCar];
    var z = c.zones[curZone];
    var q = document.getElementById("q").value.toLowerCase();
    var app = document.getElementById("app");
    if (!app || !z) return;

    var amps = ["ALL","5A","7.5A","10A","15A","20A","25A","30A"];
    var ampBtns = amps.map(function(a){
      var lbl = (a === "ALL") ? "Все" : a;
      var cls = (ampFilter === a) ? "btn act" : "btn";
      return '<button class="' + cls + '" style="padding:4px 8px;font-size:11px" onclick="setAmp(\'' + a + '\')">' + lbl + '</button>';
    }).join("");

    var rH = (z.relays || []).filter(function(x){
      return !q || (x.id + " " + x.name + " " + x.from + " " + x.to).toLowerCase().indexOf(q) !== -1;
    }).map(function(r){
      return '<div id="el-' + r.id + '" class="relay-box" onclick="selEl(\'' + r.id + '\')">' +
        '<div style="font-family:monospace;font-weight:900;font-size:13px;color:#fbbf24">' + r.id + '</div>' +
        '<div style="font-size:10px;color:#38bdf8;font-weight:700">' + r.amp + '</div>' +
        '<div class="bf-tag" style="color:#cbd5e1">' + getShortTag(r.name) + '</div></div>';
    }).join("");

    var fH = (z.fuses || []).filter(function(x){
      return !q || (x.id + " " + x.name + " " + x.from + " " + x.to).toLowerCase().indexOf(q) !== -1;
    }).map(function(f){
      var col = getFuseColorCls(f.amp);
      var dim = (ampFilter !== "ALL" && String(f.amp).toUpperCase() !== ampFilter) ? " dim" : "";
      return '<div id="el-' + f.id + '" class="blade-fuse ' + col + dim + '" onclick="selEl(\'' + f.id + '\')">' +
        '<div class="bf-amp">' + f.amp + '</div>' +
        '<div class="bf-id">' + f.id + '</div>' +
        '<div class="bf-tag">' + getShortTag(f.name) + '</div></div>';
    }).join("");

    var schHtml = (showInlineSch && typeof window.renderProSchema === "function") ? window.renderProSchema(c) : "";

    app.innerHTML =
      '<div style="display:flex;gap:6px;flex-wrap:wrap">' +
        '<button class="btn ' + (curZone==="CAB"?"act":"") + '" onclick="curZone=\'CAB\';draw()">🚗 Салонный блок</button>' +
        '<button class="btn ' + (curZone==="ENG"?"act":"") + '" onclick="curZone=\'ENG\';draw()">🔥 Подкапотный блок</button>' +
        '<button class="btn ' + (showInlineSch?"act":"") + '" onclick="showInlineSch=!showInlineSch;draw()">' + (showInlineSch?"📐 Скрыть схему":"📐 Показать схему") + '</button>' +
      '</div>' +
      '<div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap">' +
        '<span style="font-size:11px;color:#94a3b8;font-weight:700">Фильтр по амперам:</span>' + ampBtns +
      '</div>' +

<script>
(function(){
  var prevDraw = window.draw;
  window.draw = function() {
    prevDraw();
    if (curTab !== "med") return;
    var meta = CATALOG.find(function(x){ return x.id === curCar; });
    if (meta && meta.pro && !isPro) return;

    var app = document.getElementById("app");
    var list = (window.FOLK_MED && window.FOLK_MED[curCar]) ? window.FOLK_MED[curCar] : [];
    var q = document.getElementById("q").value.toLowerCase();
    var cName = CARS[curCar] ? CARS[curCar].name : curCar;

    var bEl   = (medCat === "Электрика") ? "btn act" : "btn";
    var bHod  = (medCat === "Ходовка") ? "btn act" : "btn";
    var bCross= (medCat === "Аналоги") ? "btn act" : "btn";

    var cards = list.filter(function(item){
      var okCat = (item.cat === medCat);
      var okQ = !q || (item.s + " " + item.b + " " + item.fix + " " + (item.tools || "")).toLowerCase().indexOf(q) !== -1;
      return okCat && okQ;
    }).map(function(item){
      var isCross = (item.cat === "Аналоги");
      var isHod   = (item.cat === "Ходовка");
      var border  = isCross ? "#22c55e" : (isHod ? "#38bdf8" : "#f59e0b");
      var badge   = isCross ? "🔄 ПРОВЕРЕННЫЙ АНАЛОГ" : (isHod ? "🔩 ХОДОВКА И ТОРМОЗА" : "⚡ ЭЛЕКТРИКА / ДВС / ОЖ");
      var bCol    = isCross ? "#4ade80" : (isHod ? "#38bdf8" : "#fbbf24");
      var lbl1    = isCross ? "📦 Узел: " : "❓ Симптом: ";
      var lbl2    = isCross ? "✅ Что брать / Артикул: " : "🛠 Устранение: ";
      var toolsTxt = item.tools || (isHod ? "Балонный ключ, домкрат, головки 13/17/19, WD-40" : "Мультиметр, отвёртка шлицевая, ключ на 10, набор предов");

      return '<div class="card" style="border-left:4px solid ' + border + '">' +
        '<div style="font-size:11px;color:' + bCol + ';font-weight:800;margin-bottom:3px">' + badge + ' • ' + item.b + '</div>' +
        '<div style="font-size:14px;font-weight:800;color:#f8fafc;margin-bottom:6px">' + lbl1 + item.s + '</div>' +
        '<div style="font-size:11px;color:#fef08a;background:#1e1b4b;border:1px solid #eab308;padding:5px 8px;border-radius:6px;margin-bottom:6px">' +
          '<b>🧰 Что потребуется с собой:</b> ' + toolsTxt +
        '</div>' +
        '<div style="font-size:12px;color:#34d399;background:#0b1220;padding:7px 9px;border-radius:6px;line-height:1.45">' +
          '<b>' + lbl2 + '</b>' + item.fix +
        '</div></div>';
    }).join("");

    var ptBar = app.firstChild;
    app.innerHTML = "";
    if (ptBar && ptBar.querySelector && ptBar.querySelector("select")) app.appendChild(ptBar);

    var hdr = document.createElement("div");
    hdr.className = "card";
    hdr.style.cssText = "border-color:#38bdf8;background:#0b1220";
    hdr.innerHTML =
      '<b style="color:#38bdf8;font-size:13px">🩺 Детские болячки, симптомы и инструмент: ' + cName + '</b>' +

        '<button class="' + bEl + '" onclick="setMedCat(\'Электрика\')">⚡ Электрика / ДВС / ОЖ</button>' +
        '<button class="' + bHod + '" onclick="setMedCat(\'Ходовка\')">🔩 Ходовка и тормоза</button>' +
        '<button class="' + bCross + '" onclick="setMedCat(\'Аналоги\')">🔄 Аналоги / Кроссы</button>' +
      '</div>';
    app.appendChild(hdr);

    var listWrap = document.createElement("div");
    listWrap.style.cssText = "display:flex;flex-direction:column;gap:10px";
    listWrap.innerHTML = cards || '<div class="card">Ничего не найдено по запросу.</div>';
    app.appendChild(listWrap);
  };
  draw();
})();
</script>

<script>
window.setAnalogSub = function(s) { window.ANALOG_SUB = s; window.renderMedDirect(); };

(function(){
  var prevMed = window.renderMedDirect;
  window.renderMedDirect = function() {
    if (typeof prevMed === "function") prevMed();
    if (curTab !== "med" || (window.medCat || "Электрика") !== "Аналоги") return;

    var app = document.getElementById("app");
    var wrap = app ? app.lastChild : null;
    if (!wrap) return;

    var q = document.getElementById("q").value.toLowerCase();
    var cName = CARS[curCar] ? CARS[curCar].name : curCar;
    var sub = window.ANALOG_SUB || "ALL";
    var list = (window.ANALOG_CATALOG && window.ANALOG_CATALOG[curCar]) ? window.ANALOG_CATALOG[curCar] : [];

    function sCls(name) { return (sub === name) ? "btn act" : "btn"; }

    var subBar =
      '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;padding-top:8px;border-top:1px solid #1e293b">' +
        '<span style="font-size:11px;color:#94a3b8;font-weight:700;align-self:center">Подраздел:</span>' +
        '<button class="' + sCls("ALL") + '" style="padding:4px 8px;font-size:11px" onclick="setAnalogSub(\'ALL\')">Все узлы</button>' +
        '<button class="' + sCls("ДВС") + '" style="padding:4px 8px;font-size:11px" onclick="setAnalogSub(\'ДВС\')">⚙️ ДВС и ГРМ</button>' +
        '<button class="' + sCls("Подвеска") + '" style="padding:4px 8px;font-size:11px" onclick="setAnalogSub(\'Подвеска\')">🔩 Подвеска</button>' +
        '<button class="' + sCls("Тормоза") + '" style="padding:4px 8px;font-size:11px" onclick="setAnalogSub(\'Тормоза\')">🛑 Тормоза</button>' +
        '<button class="' + sCls("Электрика") + '" style="padding:4px 8px;font-size:11px" onclick="setAnalogSub(\'Электрика\')">⚡ Электрика</button>' +
      '</div>';

    var cards = list.filter(function(item){
      var okSub = (sub === "ALL") || (item.sub === sub);
      var okQ = !q || (item.part + " " + item.oem + " " + item.cross + " " + item.top.join(" ")).toLowerCase().indexOf(q) !== -1;
      return okSub && okQ;
    }).map(function(item){
      var topHtml = (item.top || []).map(function(line){
        return '<div style="padding:4px 6px;border-bottom:1px solid #14532d;font-size:12px;color:#dcfce7">' + line + '</div>';
      }).join("");

      return '<div class="card" style="border-left:4px solid #22c55e">' +
        '<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;margin-bottom:4px">' +
          '<span style="background:#0c4a6e;color:#38bdf8;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:800">' + item.sub.toUpperCase() + '</span>' +
          '<span style="font-family:monospace;font-size:11px;color:#94a3b8">OEM: <b style="color:#fbbf24">' + item.oem + '</b></span>' +
        '</div>' +
        '<div style="font-size:14px;font-weight:800;color:#f8fafc;margin-bottom:6px">' + item.part + '</div>' +
        '<div style="font-size:11px;color:#fef08a;background:#1e1b4b;border:1px solid #eab308;padding:5px 8px;border-radius:6px;margin-bottom:6px">' +
          '<b>🔄 Взаимозаменяемость (кросс):</b> ' + item.cross +
        '</div>' +
        '<div style="background:#052e16;border:1.5px solid #22c55e;border-radius:7px;padding:4px 6px">' +
          '<div style="font-size:11px;font-weight:800;color:#4ade80;padding:2px 4px">🏆 ТОП-3 лучших аналога по отзывам с артикулами:</div>' +
          topHtml +
        '</div>' +
      '</div>';
    }).join("");

    wrap.innerHTML =
      '<div class="card" style="border-color:#38bdf8;background:#0b1220">' +
        '<b style="color:#38bdf8;font-size:13px">🩺 База болячек, инструмент и моменты затяжки: ' + cName + '</b>' +
        '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">' +
          '<button class="btn" onclick="window.medCat=\'Электрика\';window.renderMedDirect()">⚡ Электрика / ДВС / ОЖ</button>' +
          '<button class="btn" onclick="window.medCat=\'Ходовка\';window.renderMedDirect()">🔩 Ходовка и тормоза</button>' +

          '<button class="btn" onclick="window.medCat=\'Моменты\';window.renderMedDirect()">🔩 ТО и Моменты (Н·м)</button>' +
        '</div>' + subBar +
      '</div>' + (cards || '<div class="card">По выбранному подразделу аналогов пока нет.</div>');
  };
  if (curTab === "med" && (window.medCat || "") === "Аналоги") window.renderMedDirect();
})();
</script>

<script>
window.getCarSpecificGuides = function(carId) {
  var cObj = (typeof CARS !== "undefined" && CARS[carId]) ? CARS[carId] : {name: carId};
  var cName = cObj.name || carId;
  var pt = (typeof POWERTRAIN_DB !== "undefined" && POWERTRAIN_DB[carId]) ? POWERTRAIN_DB[carId] : null;
  var engTxt = (pt && pt.engines && pt.engines[window.SEL_ENG || 0]) ? pt.engines[window.SEL_ENG || 0].n : "штатный ДВС";
  var engInfo = (pt && pt.engines && pt.engines[window.SEL_ENG || 0]) ? pt.engines[window.SEL_ENG || 0].info : "";

  var isVag = /POLO|OCTAVIA|FABIA|OLDVAG|AUDI/.test(carId);
  var isNiva = /NIVA|CHEVYNIVA/.test(carId);
  var isVaz = /VESTA|GRANTA|LARGUS|PRIORA|KALINA|VAZ2114/.test(carId);
  var isFocus = (carId === "FOCUS");

  var calTool = isVag ? "Шестигранник на 7 (пальцы суппорта), ключ на 13/15, головка 18/21 (скоба)"
              : isNiva ? "Ключи на 13 и 17, плоская отвёртка, молоток"
              : "Ключи на 13, 14 и 17, головка для скобы суппорта";

  var hubTool = isNiva ? "Головка на 27, зубило для раскерновки, съёмник шаровых (для кулаков под подшипник Iveco)"
              : isVag ? "12-гранная головка на 24 (или шестигранник 17), вороток 1 м, Torx T30"
              : "Головка на 30 или 32, вороток 1 м, съёмник шаровых";

  var hubTip  = isNiva ? "На штатных конических подшипниках Шнивы/Нивы после затяжки гайки (20 Н·м) отпусти её на 20–25° для теплового зазора, иначе заклинит ступицу! На подшипнике Iveco тяни до упора (200 Н·м)."
              : "На " + cName + " подшипник имеет магнитную полосу ABS с одной стороны — проверь её лезвием и ставь магнитной стороной строго к датчику ABS!";

  var pumpStep = isFocus
    ? "2. ВНИМАНИЕ ДЛЯ FORD FOCUS: Заводского лючка под задним сиденьем НЕТ! Либо снимай бак на яме (со снятием выхлопа), либо аккуратно вырежи сервисное окно 15×15 см ножницами по металлу по разметке под диваном."

  return (window.DIY_GUIDES || []).map(function(g, i) {
    var copy = { num: g.num, title: g.title + " — " + cName.split("(")[0].trim(), tools: g.tools, steps: g.steps.slice(), hack: g.hack, check: g.check };
    if (i === 0) {
      copy.tools = "Баллонник, домкрат + упор, " + calTool + ", струбцина, смазка TRW PFG110, пластиковый хомутик.";
    } else if (i === 1) {
      copy.tools = hubTool + ", тиски/съёмник, WD-40.";
      copy.hack = hubTip;
    } else if (i === 2) {
      copy.steps = "6. Паспортные данные для " + engTxt + ": " + engInfo;

      copy.steps[1] = pumpStep;
    } else if (i === 6) {
      copy.hack = "Особенности ГРМ для " + engTxt + ": " + engInfo;
    }
    return copy;
  });
};

window.revEngineAnim = function(isDiesel) {
  if (window._revTimer) clearInterval(window._revTimer);
  var idle = isDiesel ? 780 : 820;
  var peak = isDiesel ? 4800 : 6500;
  var maxScale = isDiesel ? 6000 : 8000;
  var t = 0;
  window._revTimer = setInterval(function() {
    t += 30;
    var rpm = idle;
    if (t <= 840) {
      var k = t / 840;
      rpm = idle + (peak - idle) * (1 - Math.pow(1 - k, 1.8));
    } else if (t <= 1560) {
      rpm = peak - ((t % 120 < 60) ? 240 : 0);
    } else if (t <= 2940) {
      var k2 = (t - 1560) / 1380;
      rpm = peak - (peak - idle) * (1 - Math.pow(1 - k2, 1.7));
    } else {
      rpm = idle;
      clearInterval(window._revTimer);
    }
    var pct = Math.min(1, rpm / maxScale);
    var deg = pct * 250;
    var needle = document.getElementById("nfs-rpm-needle");
    var valTxt = document.getElementById("nfs-rpm-val");
    if (needle) needle.setAttribute("transform", "rotate(" + deg.toFixed(1) + " 115 102)");
    if (valTxt) {
      valTxt.textContent = Math.round(rpm);
      valTxt.setAttribute("fill", rpm >= (isDiesel ? 4500 : 6000) ? "#ef4444" : "#ffffff");
    }
  }, 30);
};

window.getNfsBodySvg = function(carId) {
  var c = window.CAR_SPECS_ART[carId] || window.CAR_SPECS_ART.VESTA;
  var w1 = 98, w2 = 294, wy = 118, r = c.wh;
  var body = "M 34," + c.cl + " L 38," + (c.hood+6) + " L 58," + c.hood + " L 130," + (c.hood-6) +
             " L " + c.r1 + "," + c.roof + " L " + c.r2 + "," + c.roof +
             " L " + (c.trunk-26) + "," + (c.trY-2) + " L " + c.trunk + "," + c.trY +
             " L " + (c.trunk+2) + "," + c.cl +
             " L " + (w2+r+5) + "," + c.cl + " A " + (r+4) + "," + (r+4) + " 0 0 0 " + (w2-r-5) + "," + c.cl +
             " L " + (w1+r+5) + "," + c.cl + " A " + (r+4) + "," + (r+4) + " 0 0 0 " + (w1-r-5) + "," + c.cl + " Z";

  var midX = Math.round((c.r1 + c.r2)/2) + 8;
  var win1 = "M 138," + (c.hood-7) + " L " + (c.r1+4) + "," + (c.roof+5) + " L " + (midX-3) + "," + (c.roof+5) + " L " + (midX-3) + "," + (c.hood-7) + " Z";
  var win2 = "M " + (midX+3) + "," + (c.roof+5) + " L " + (c.r2-4) + "," + (c.roof+5) + " L " + (c.trunk-30) + "," + (c.trY-3) + " L " + (midX+3) + "," + (c.hood-7) + " Z";

  var extras = "";
  if (c.xLine) extras += '<path d="M 118,86 L 146,108 L 122,116 M 272,84 L 246,106 L 268,116" fill="none" stroke="' + c.col + '" stroke-width="1.8" opacity="0.85"/>';
  if (c.fin)   extras += '<path d="M ' + (c.r2-18) + ',' + c.roof + ' L ' + (c.r2-8) + ',' + (c.roof-7) + ' L ' + (c.r2-4) + ',' + c.roof + ' Z" fill="' + c.col + '"/>';
  if (c.rails) extras += '<path d="M ' + (c.r1+12) + ',' + (c.roof-3) + ' L ' + (c.r2-10) + ',' + (c.roof-3) + '" stroke="#cbd5e1" stroke-width="2.2" stroke-linecap="round"/>';
  if (c.wing)  extras += '<path d="M ' + (c.r2-4) + ',' + c.roof + ' L ' + (c.r2+12) + ',' + (c.roof-5) + ' L ' + (c.r2+10) + ',' + (c.roof+2) + ' Z" fill="' + c.col + '"/>';
  if (c.scoop) extras += '<path d="M 76,' + (c.hood-2) + ' L 98,' + (c.hood-6) + ' L 102,' + (c.hood-3) + ' Z" fill="#0f172a" stroke="' + c.col + '" stroke-width="1"/>';
  if (c.mold)  extras += '<line x1="132" y1="104" x2="258" y2="104" stroke="#090d16" stroke-width="3"/>';

  function wheel(cx) {
    var spokes = "";
    for (var a = 0; a < 360; a += 72) {
      var rad = a * Math.PI / 180;
      spokes += '<line x1="' + cx + '" y1="' + wy + '" x2="' + (cx + Math.cos(rad)*(r-7)).toFixed(1) + '" y2="' + (wy + Math.sin(rad)*(r-7)).toFixed(1) + '" stroke="#cbd5e1" stroke-width="2"/>';
    }
    return '<circle cx="' + cx + '" cy="' + wy + '" r="' + r + '" fill="#070a10" stroke="#334155" stroke-width="3"/>' +
           '<circle cx="' + cx + '" cy="' + wy + '" r="' + (r-6) + '" fill="#0f172a" stroke="' + c.col + '" stroke-width="1.5"/>' +
           '<path d="M ' + (cx+4) + ',' + (wy-7) + ' A 8,8 0 0 1 ' + (cx+7) + ',' + (wy+3) + '" stroke="#ef4444" stroke-width="3.5" fill="none"/>' +
           spokes +
           '<circle cx="' + cx + '" cy="' + wy + '" r="4.5" fill="' + c.col + '"/>';
  }

  return '<svg viewBox="0 0 390 158" style="width:100%;height:auto;display:block">' +
    '<defs>' +
      '<linearGradient id="nfsPaint" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="' + c.col + '" stop-opacity="0.95"/>' +
        '<stop offset="48%" stop-color="#1e293b"/>' +
        '<stop offset="100%" stop-color="#060911"/>' +
      '</linearGradient>' +
      '<pattern id="bpGrid" width="20" height="20" patternUnits="userSpaceOnUse">' +
        '<path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1e3a5f" stroke-width="0.6" stroke-opacity="0.45"/>' +
      '</pattern>' +
    '</defs>' +
    '<rect x="0" y="0" width="390" height="158" fill="url(#bpGrid)"/>' +
    '<line x1="18" y1="143" x2="372" y2="143" stroke="' + c.col + '" stroke-width="1.2" stroke-opacity="0.6"/>' +
    '<line x1="' + w1 + '" y1="143" x2="' + w1 + '" y2="149" stroke="' + c.col + '"/><line x1="' + w2 + '" y1="143" x2="' + w2 + '" y2="149" stroke="' + c.col + '"/>' +
    '<text x="196" y="153" fill="#64748b" font-size="8" font-family="monospace" text-anchor="middle">WHEELBASE // SPEC BLUEPRINT</text>' +
    '<path d="' + body + '" fill="url(#nfsPaint)" stroke="' + c.col + '" stroke-width="1.8" stroke-linejoin="round"/>' +
    '<path d="' + win1 + '" fill="#040812" stroke="' + c.col + '" stroke-width="1.1"/>' +
    '<path d="' + win2 + '" fill="#040812" stroke="' + c.col + '" stroke-width="1.1"/>' +
    '<path d="M 58,' + c.hood + ' L 130,' + (c.hood-6) + ' L 265,' + (c.hood-6) + ' L ' + (c.trunk-6) + ',' + (c.trY+2) + '" fill="none" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.45"/>' +
    '<line x1="' + midX + '" y1="' + (c.hood-6) + '" x2="' + midX + '" y2="' + (c.cl-3) + '" stroke="#060911" stroke-width="1.4"/>' +
    '<rect x="' + (midX-16) + '" y="' + (c.hood+3) + '" width="9" height="3" rx="1.5" fill="#cbd5e1"/>' +
    '<rect x="' + (c.r2-22) + '" y="' + (c.hood+3) + '" width="9" height="3" rx="1.5" fill="#cbd5e1"/>' +
    '<ellipse cx="142" cy="' + (c.hood-6) + '" rx="7" ry="4" fill="#1e293b" stroke="' + c.col + '" stroke-width="1.2"/>' +
    '<path d="M 38,' + (c.hood+5) + ' L 56,' + (c.hood+1) + ' L 52,' + (c.hood+8) + ' L 37,' + (c.hood+9) + ' Z" fill="#fef08a"/>' +
    '<path d="M ' + (c.trunk-10) + ',' + (c.trY+2) + ' L ' + c.trunk + ',' + (c.trY+3) + ' L ' + (c.trunk+1) + ',' + (c.trY+11) + ' L ' + (c.trunk-11) + ',' + (c.trY+10) + ' Z" fill="#ef4444"/>' +
    extras +
    wheel(w1) + wheel(w2) +
  '</svg>';
};
