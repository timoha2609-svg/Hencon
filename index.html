function openSvg(x){
  document.getElementById("mt").textContent="Лист "+x.a+": "+x.b;
  const mb=document.getElementById("mb");mb.textContent="";

<script>
window.openStepUI = box => {

    box.querySelectorAll("span").forEach(p => p.onclick = () => { i = +p.dataset.k; draw(); });
    box.querySelector("#so").onclick = () => { if (i < steps.length - 1) { i++; draw(); } };

};

<script>
window.calcHSF=(hex,isFac)=>{const c=hex.trim().toUpperCase().split(" ").join("");if(!c)return"ERR";const rev=c.split("").reverse().join("");const v=BigInt("0x"+rev);const bStr=v.toString(2).padStart(36,"0").split("").reverse().join("");const map=(isFac?"3,2,1,0,7,6,5,4,11,10,9,8,15,14,13,12,19,18,17,16,23,22,21,20,27,26,25,24,31,30,29,28":"7,6,5,4,3,2,1,0,15,14,13,12,11,10,9,8,23,22,21,20,19,18,17,16,31,30,29,28,27,26,25,24").split(",");let out="";for(let i=0;i<32;i++){const idx=Number(map.slice(i,i+1).pop());out+=bStr.slice(idx,idx+1);}const num=parseInt(out,2)^Number(isFac?0x5C383913:0x38382293);return(num>>>0).toString(16).toUpperCase().padStart(8,"0")};window.openKeyUI = box => {
  box.innerHTML = `<div class="card" style="border-color:#f0883e">` +
    `<b style="color:#ffa657">KEYGEN SERVICE / FACTORY (HSF)</b>` +
    `<div style="margin:6px 0;display:flex;gap:10px">` +
    `<label><input type="radio" name="klvl" value="0" checked> Service (Slesar)</label>` +
    `<label><input type="radio" name="klvl" value="1"> Factory (Inzhener)</label></div>` +
    `<input id="kinp" placeholder="Kod s mashiny (HEX 0-9, A-F)" style="width:180px;padding:6px;text-transform:uppercase"> ` +
    `<button id="kbtn" class="btn b2">Get Code</button>` +
    `<div id="kout" style="margin-top:8px;font-size:18px;font-weight:bold;color:#7ee787;letter-spacing:2px"></div></div>`;
  box.querySelector("#kbtn").onclick = () => {
    const isFac = box.querySelector("input:checked").value === "1";
    const ans = window.calcHSF(box.querySelector("#kinp").value, isFac);
    box.querySelector("#kout").textContent = ans;
  };
};
